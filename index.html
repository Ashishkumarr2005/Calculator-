<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculator</title>
<style>
:root{--bg:#e9e6df;--body:#2b2f36;--screen:#c9d6b8;--ink:#1d2417;--key:#f6f4ee;--keyink:#23262b;--op:#3d6b5e;--opink:#fff;--clr:#b5483a;--shadow:#00000033;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--body:#22252b;--screen:#aebd9c;--key:#32363d;--keyink:#eceae4;--op:#4f8a79}}
:root[data-theme="dark"]{--bg:#15171a;--body:#22252b;--screen:#aebd9c;--key:#32363d;--keyink:#eceae4;--op:#4f8a79}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;padding:16px}
.calc{width:100%;max-width:340px;background:var(--body);padding:18px;border-radius:22px;box-shadow:0 18px 40px var(--shadow)}
.screen{background:var(--screen);color:var(--ink);border-radius:12px;padding:12px 14px;text-align:right;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:inset 0 3px 8px #0003;overflow:hidden}
.expr{font-size:.95rem;min-height:1.3em;opacity:.65;word-break:break-all}
.val{font-family:"Courier New",monospace;font-size:2.4rem;font-weight:700;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
button{font:inherit;font-size:1.3rem;padding:0;height:58px;border:0;border-radius:12px;background:var(--key);color:var(--keyink);cursor:pointer;box-shadow:0 3px 0 #0004;transition:transform .06s,box-shadow .06s}
button:active,button.press{transform:translateY(3px);box-shadow:0 0 0 #0004}
button:focus-visible{outline:3px solid #f0c15a;outline-offset:2px}
button.op{background:var(--op);color:var(--opink)}
button.clr{background:var(--clr);color:#fff}
